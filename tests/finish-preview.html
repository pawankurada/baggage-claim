<body><main class="shell"><header><a class="brand" href="./">♡ &nbsp; A little birthday adventure</a><span class="edition">MADE WITH LOVE · PROTOTYPE</span></header><div class="game-wrap"><canvas id="game" aria-label="Birthday platform adventure"></canvas><div id="hud" hidden><span id="counter">Bags: 0 / 5</span><span id="section"></span><button id="restart" aria-label="Restart adventure">Restart</button></div><div id="stage-intro" hidden></div><div id="overlay"></div></div><footer><span>A / D or ← / → to move &nbsp; · &nbsp; Space to jump</span><span>Take your time. Every little step counts. ♡</span></footer></main><script type="module">
